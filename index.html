<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create and scan QR codes, PDF417, Aztec, Data Matrix, Micro QR, and 1D barcodes locally in your browser. Private, fast, and no uploads."
    />
    <meta name="application-name" content="QR Studio Local" />
    <meta name="author" content="Songming.org" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f0e9" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="QR Local" />
    <link rel="canonical" href="https://qrlocal.songming.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="QR Studio Local" />
    <meta property="og:url" content="https://qrlocal.songming.org/" />
    <meta
      property="og:title"
      content="QR Studio Local — Create &amp; scan QR codes and barcodes locally"
    />
    <meta
      property="og:description"
      content="Create and scan QR codes and barcodes locally in your browser. Private, fast, and no uploads."
    />
    <meta
      property="og:image"
      content="https://qrlocal.songming.org/illu.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="QR Studio Local — a private, browser-based QR code and barcode studio."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QR Studio Local — Create &amp; scan QR codes and barcodes locally"
    />
    <meta
      name="twitter:description"
      content="Create and scan QR codes and barcodes locally in your browser. Private, fast, and no uploads."
    />
    <meta
      name="twitter:image"
      content="https://qrlocal.songming.org/illu.png"
    />
    <meta
      name="twitter:image:alt"
      content="QR Studio Local — a private, browser-based QR code and barcode studio."
    />
    <title>QR Studio Local – Create &amp; scan QR codes and barcodes locally</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
      try {
        const savedTheme = window.localStorage.getItem("qr-studio-theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : preferredTheme;
      } catch {
        document.documentElement.dataset.theme = preferredTheme;
      }

      const normalizedPath = window.location.pathname.replaceAll("\\", "/");
      const isPortableCopy =
        normalizedPath.includes("/dist/") || normalizedPath.includes("/docs/");
      if (window.location.protocol === "file:" && !isPortableCopy) {
        window.location.replace(
          new URL("./docs/index.html", window.location.href).href,
        );
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
